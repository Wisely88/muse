version: '3.8'

services:
  muse-prompt-studio:
    build: .
    image: muse-prompt-studio:latest
    container_name: muse-prompt-studio
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
